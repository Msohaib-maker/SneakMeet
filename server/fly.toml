# Fly.io config for the BetterZoom signaling server.
# Rooms live in memory, so run exactly ONE machine (see README).
app = "presage-meet-signal"   # must be globally unique: change it if taken
primary_region = "iad"        # pick one near you: `fly platform regions`

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"   # sleeps when no one is connected (saves cost)
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
